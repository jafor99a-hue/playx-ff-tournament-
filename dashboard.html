
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayX FF Dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="auth-box">
<form id="demo-payment-form">
  <label for="method">Demo Payment Method:</label>
  <select id="method" required>
    <option value="bkash">bKash (Demo)</option>
    <option value="nagad">Nagad (Demo)</option>
  </select>

  <label for="amount">Demo Amount (৳):</label>
  <input
    type="number"
    id="amount"
    min="1"
    max="10000"
    step="1"
    required
  />

  <label for="txid">Demo Transaction ID:</label>
  <input
    type="text"
    id="txid"
    maxlength="80"
    required
    placeholder="DEMO-12345"
  />

  <button type="submit">Submit Demo Request</button>
  <p id="demo-payment-message" role="status"></p>
</form>

    <h1>PlayX FF Tournament</h1>
    <h2>Dashboard</h2>
    <p id="status">Login যাচাই হচ্ছে...</p>
    <button id="logout">Logout</button>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const status = document.getElementById("status");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("./login.html");
        return;
      }

      status.textContent =
        "স্বাগতম, " + (user.displayName || user.email);
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("./login.html");
    });
  </script>
</body>
</html>
