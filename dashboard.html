
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayX FF Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101323;
      color: white;
      padding: 20px;
    }
    .header, .panel {
      background: #1d2440;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    h1 { color: #ffca28; }
    a, button {
      display: block;
      background: #ffca28;
      color: #111;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PlayX FF</h1>
    <p>Free Fire Tournament Dashboard</p>
    <p id="user">Checking login...</p>
  </div>

  <div class="panel">
    <h2>Welcome to Dashboard!</h2>
    <p>এখান থেকে তোমার Tournament Website পরিচালনা করতে পারবে।</p>
    <a href="index.html">Home Page</a>
    <button id="logout">Logout</button>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    import { firebaseConfig }
      from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("user").textContent =
          "Logged in: " + (user.email || "Player");
      } else {
        window.location.replace("index.html");
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("index.html");
    });
  </script>
</body>
</html>
