<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palyx FF Tournament</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #58a6ff; margin-bottom: 20px; font-size: 24px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
    input { width: 100%; padding: 12px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #58a6ff; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-primary { background: #238636; color: white; }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary { background: #1f6feb; color: white; }
    .btn-secondary:hover { background: #388bfd; }
    .btn-danger { background: #da3633; color: white; width: 100%; margin-top: 15px; }
    #user-dashboard { display: none; }
    .user-email { color: #7ee787; font-weight: bold; word-break: break-all; margin: 15px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎮 Palyx FF Tournament</h2>

    <!-- ফর্ম (লগইন ও সাইনআপ) -->
    <div id="auth-box">
      <div class="input-group">
        <label for="email">ইমেইল ঠিকানা</label>
        <input type="email" id="email" placeholder="example@gmail.com">
      </div>
      <div class="input-group">
        <label for="password">পাসওয়ার্ড</label>
        <input type="password" id="password" placeholder="******">
      </div>
      <div class="btn-group">
        <button class="btn-primary" id="signup-btn">অ্যাকাউন্ট খুলুন</button>
        <button class="btn-secondary" id="login-btn">লগইন করুন</button>
      </div>
    </div>

    <!-- ড্যাশবোর্ড (লগইন করার পর দেখাবে) -->
    <div id="user-dashboard">
      <h3>স্বাগতম! 👋</h3>
      <p class="user-email" id="user-display-email"></p>
      <p style="margin-bottom: 15px; font-size: 14px;">আপনি সফলভাবে টুর্নামেন্ট প্যানেলে প্রবেশ করেছেন।</p>
      <button class="btn-danger" id="logout-btn">লগআউট করুন</button>
    </div>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyDDweLEqB6C12QS67Ug5U2_s_HHgnreB5s",
      authDomain: "palyx-ff-tournament.firebaseapp.com",
      databaseURL: "https://palyx-ff-tournament-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "palyx-ff-tournament",
      storageBucket: "palyx-ff-tournament.firebasestorage.app",
      messagingSenderId: "809369357695",
      appId: "1:809369357695:web:860377cae1659623815e4a",
      measurementId: "G-E0GMSK7CP9"
    };

    // ফায়ারবেস চালু
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const authBox = document.getElementById("auth-box");
    const userDashboard = document.getElementById("user-dashboard");
    const userDisplayEmail = document.getElementById("user-display-email");

    // ১. সাইনআপ / অ্যাকাউন্ট তৈরি
    document.getElementById("signup-btn").addEventListener("click", () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      if(!email || !password) return alert("ইমেইল ও পাসওয়ার্ড দিন!");

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => alert("অ্যাকাউন্ট তৈরি সফল হয়েছে!"))
        .catch((err) => alert("ত্রুটি: " + err.message));
    });

    // ২. লগইন
    document.getElementById("login-btn").addEventListener("click", () => {
      const email = emailInput.value;
      const password = passwordInput.value;
      if(!email || !password) return alert("ইমেইল ও পাসওয়ার্ড দিন!");

      signInWithEmailAndPassword(auth, email, password)
        .then(() => alert("সফলভাবে লগইন হয়েছে!"))
        .catch((err) => alert("লগইন ব্যর্থ: " + err.message));
    });

    // ৩. লগআউট
    document.getElementById("logout-btn").addEventListener("click", () => {
      signOut(auth).then(() => alert("লগআউট করা হয়েছে।"));
    });

    // ৪. ইউজার স্ট্যাটাস চেক (লগইন করা আছে কি না)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authBox.style.display = "none";
        userDashboard.style.display = "block";
        userDisplayEmail.innerText = user.email;
      } else {
        authBox.style.display = "block";
        userDashboard.style.display = "none";
      }
    });
  </script>
</body>
</html>
