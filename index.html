<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayX FF Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="logo" href="/">Play<span>X</span><small>FF TOURNAMENT</small></a><div id="identity" class="identity"><span class="muted">লোড হচ্ছে…</span></div></div>
<nav class="wrap tabs"><button data-view="home" class="active">টুর্নামেন্ট</button><button data-view="wallet">ওয়ালেট</button><button data-view="mine">আমার ম্যাচ</button><button data-view="admin" id="adminTab" hidden>অ্যাডমিন</button></nav></header>
<main class="wrap main">
<div class="notice">PlayX Tournament — নিরাপদ ডেমো স্টার্টার। Deposit অনুরোধ Admin যাচাই না করা পর্যন্ত ব্যালেন্সে যোগ হবে না।</div>
<section id="auth" class="panel"><h2>অ্যাকাউন্ট</h2><div class="authgrid">
<form id="loginForm" class="form"><h3>লগইন</h3><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">লগইন</button></form>
<form id="registerForm" class="form"><h3>নতুন অ্যাকাউন্ট</h3><label>Username<input name="username" minlength="3" maxlength="32" required pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Email (ঐচ্ছিক)<input name="email" type="email" autocomplete="email"></label><label>Free Fire UID<input name="freeFireUid" maxlength="32"></label><label>Password (কমপক্ষে ১০ অক্ষর)<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><button class="btn yellow" type="submit">অ্যাকাউন্ট তৈরি</button></form>
</div></section>
<section id="content"></section><div id="toast" role="status" class="toast" hidden></div>
</main><footer class="wrap muted footer">PlayX FF Tournament · বাস্তব পেমেন্টের আগে payment provider integration ও নিরাপত্তা যাচাই প্রয়োজন।</footer>
</body></html>
