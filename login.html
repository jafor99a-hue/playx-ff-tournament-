<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayX FF - Login / Register</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="auth-box">
    <h1>PlayX FF Tournament</h1>
    <h2>Login / Register</h2>

    <form id="auth-form">
      <input
        id="email"
        type="email"
        placeholder="আপনার Email লিখুন"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password (কমপক্ষে ৬ অক্ষর)"
        minlength="6"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="login-btn">Login</button>
      <button type="button" id="register-btn">Register</button>

      <p id="message" role="status" aria-live="polite">
        পেজ লোড হচ্ছে...
      </p>
    </form>
  </main>

  <script>
    document.getElementById("message").textContent =
      "HTML এবং JavaScript চালু আছে। Firebase সংযোগ হচ্ছে...";
  </script>

  <script type="module">
    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("login-btn");
    const registerBtn = document.getElementById("register-btn");

    let auth = null;
    let busy = false;
    let signIn;
    let register;

    async function initialize() {
      try {
        message.textContent = "Firebase সংযোগ হচ্ছে...";

        const config = await import("./firebase-config.js");
        auth = config.auth;

        if (!auth) {
          throw new Error(
            "firebase-config.js ফাইলে auth export পাওয়া যায়নি।"
          );
        }

        const firebaseAuth = await import(
          "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"
        );

        signIn = firebaseAuth.signInWithEmailAndPassword;
        register = firebaseAuth.createUserWithEmailAndPassword;

        message.textContent =
          "Firebase প্রস্তুত! এখন Login অথবা Register করুন।";
      } catch (error) {
        console.error("Firebase initialization error:", error);

        message.textContent =
          "Firebase Error: " +
          (error.message || error.code || "সংযোগ করা যায়নি");

        loginBtn.disabled = true;
        registerBtn.disabled = true;
      }
    }

    async function authenticate(mode) {
      if (busy || !form.reportValidity()) {
        return;
      }

      if (!auth || !signIn || !register) {
        message.textContent =
          "Firebase প্রস্তুত হয়নি। পেজ Reload করে আবার চেষ্টা করুন।";
        return;
      }

      busy = true;
      loginBtn.disabled = true;
      registerBtn.disabled = true;

      try {
        message.textContent =
          mode === "login"
            ? "Login হচ্ছে..."
            : "নতুন অ্যাকাউন্ট তৈরি হচ্ছে...";

        if (mode === "login") {
          await signIn(
            auth,
            email.value.trim(),
            password.value
          );
        } else {
          await register(
            auth,
            email.value.trim(),
            password.value
          );
        }

        message.textContent =
          "সফল! Dashboard খুলছে...";

        window.location.href = "./index.html";

      } catch (error) {
        console.error("Authentication error:", error);

        const errors = {
          "auth/invalid-email":
            "সঠিক Email ঠিকানা লিখুন।",

          "auth/invalid-credential":
            "Email অথবা Password সঠিক নয়।",

          "auth/email-already-in-use":
            "এই Email দিয়ে অ্যাকাউন্ট আগে থেকেই আছে। Login করুন।",

          "auth/weak-password":
            "কমপক্ষে ৬ অক্ষরের Password দিন।",

          "auth/operation-not-allowed":
            "Firebase-এ Email/Password sign-in চালু করুন।",

          "auth/unauthorized-domain":
            "Firebase Authorized domains-এ ওয়েবসাইটের ডোমেইন যোগ করুন।",

          "auth/network-request-failed":
            "ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।",

          "auth/too-many-requests":
            "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
        };

        message.textContent =
          errors[error.code] ||
          "সমস্যা: " +
          (error.message || error.code || "আবার চেষ্টা করুন।");

      } finally {
        busy = false;
        loginBtn.disabled = false;
        registerBtn.disabled = false;
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      authenticate("login");
    });

    registerBtn.addEventListener("click", function() {
      authenticate("register");
    });

    initialize();
  </script>
</body>
</html>
